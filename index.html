<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js"></script>
    <script type="module" src="firebase-config.js"></script>
    <title>One hour, one minute</title>
</head>
<body>
    <div id="authScreen">
        <h2>Sign in to continue</h2>
        <input type="email" id="emailInput" placeholder="Email">
        <input type="password" id="passwordInput" placeholder="Password">
        <button id="signUpBtn">Sign up</button>
        <button id="signInBtn">Log in</button>
        <p id="authError"></p>
    </div>
    <div id="homeScreen">
        <h1>Learn something new. Explain it</h1>
        <button id="randomBtn">🎲 Random Topic</button>
        
    </div>
    <div id="researchScreen">
        <p id="topicDisplay"></p>
        
    </div>
    <p id="timerDisplay"></p>
    <div id="explainScreen">
        <p id="explanationLabel">Explain what you learned</p>
        
    </div>
    <div id="resultScreen">
        <p id="resultDisplay"></p>
    </div>
</body>
</html>
